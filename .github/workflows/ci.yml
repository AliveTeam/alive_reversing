name: CI

on:
  push:
    branches: [beta, claude/ao-ae-sound-dedup-lcjqbg]
  pull_request:
    branches: [beta]

# build setting(s)
env:
  CONFIGURATION: Debug
  # Some 3rdParty submodules still declare cmake_minimum_required < 3.10, which CMake 4 rejects
  # (< 3.5) or warns about. As an env var it also reaches the `cmake -P` scripts aom runs itself,
  # at configure and build time. The Windows image's CMake 3.31 predates it, so the Windows
  # configure uses -Wno-deprecated instead.
  CMAKE_POLICY_VERSION_MINIMUM: '3.10'

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows32
            cmake_arch: Win32
            qt_arch: win32_msvc2019
            sdl_arch: x86
          - os: windows-2022
            name: Windows64
            cmake_arch: x64
            qt_arch: win64_msvc2019_64
            sdl_arch: x64
          # The AppImage and the flatpaks are separate jobs: flatpak-builder does its own
          # from-scratch build inside the flatpak SDK (different sysroot and SDL3), so it can't
          # reuse the native build. Running them in one job built the project serially 3 times.
          - os: ubuntu-26.04
            name: Linux-AppImage
          # One job per flatpak so they build in parallel. They share little code (SDL3 and a
          # few small libs), so building them in one job mostly just serialised them.
          - os: ubuntu-26.04
            name: Linux-Flatpak-Relive
            flatpak: true
            flatpak_id: io.github.AliveTeam.Relive
            flatpak_bundle: relive.flatpak
            flatpak_artifact: Linux-Release-relive-flatpak
          - os: ubuntu-26.04
            name: Linux-Flatpak-ReliveEditor
            flatpak: true
            flatpak_id: io.github.AliveTeam.ReliveEditor
            flatpak_bundle: relive-editor.flatpak
            flatpak_artifact: Linux-Release-relive-editor-flatpak
          # - os: macos-latest-large
          #   name: macOS

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 'Windows: Install SDL3'
      if: runner.os == 'Windows'
      run: |
        Invoke-WebRequest 'https://www.libsdl.org/release/SDL3-devel-3.4.14-VC.zip' -OutFile "$env:GITHUB_WORKSPACE\SDL3.zip"
        7z x SDL3.zip

    # ======================================
    #      Windows
    # ======================================

    - name: 'Windows: Install Qt 5.15.2'
      if: runner.os == 'Windows'
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: ${{ matrix.qt_arch }}

    - name: 'Windows: Build'
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build
        cmake .. -G"Visual Studio 17 2022" -DSDL3_DIR="$env:GITHUB_WORKSPACE\SDL3-3.4.14\cmake" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -A ${{ matrix.cmake_arch }} -DCI_PROVIDER="GitHub" -DBUILD_NUMBER="$env:GITHUB_RUN_NUMBER" -Wno-deprecated
        cmake --build . --config $env:CONFIGURATION
        cpack -G ZIP -C $env:CONFIGURATION

    # All the tests, including the editor ones. EditorAutomationTests launches the real editor,
    # headless, which needs SDL3.dll on PATH (install-qt-action already put Qt there).
    - name: 'Windows: Run tests'
      if: runner.os == 'Windows'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        $env:PATH = "$env:GITHUB_WORKSPACE\SDL3-3.4.14\lib\${{ matrix.sdl_arch }};$env:PATH"
        cd build
        ctest -C $env:CONFIGURATION --verbose --timeout 300

    # ======================================
    #      Linux AppImage
    # ======================================

    - name: 'Linux-AppImage: Install SDL3'
      if: matrix.name == 'Linux-AppImage'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl3-dev

    - name: 'Linux-AppImage: Install Qt 5.15.2'
      if: matrix.name == 'Linux-AppImage'
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: 'gcc_64'

    - name: 'Linux-AppImage: Build'
      if: matrix.name == 'Linux-AppImage'
      run: |
        mkdir build
        cd build
        cmake .. -G"Unix Makefiles" -DCMAKE_BUILD_TYPE=$CONFIGURATION -DCI_PROVIDER="GitHub" -DBUILD_NUMBER=$GITHUB_RUN_NUMBER
        make -j$(nproc)

    - name: 'Linux-AppImage: Run tests'
      if: matrix.name == 'Linux-AppImage'
      env:
        QT_QPA_PLATFORM: offscreen
        # The Debug build has ASan on; leak reports at exit are expected (see CLAUDE.md).
        ASAN_OPTIONS: detect_leaks=0
      run: |
        cd build
        ctest --verbose --timeout 300

    - name: 'Linux-AppImage: Build AppImage'
      if: matrix.name == 'Linux-AppImage'
      run: |
        cd build
        cmake --build . --target appimage

    # ======================================
    #      Linux Flatpak
    # ======================================

    - name: 'Linux-Flatpak: Install flatpak & flatpak-builder'
      if: matrix.flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder ccache
        sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install -y --noninteractive flathub org.kde.Platform//5.15-24.08 org.kde.Sdk//5.15-24.08

    # flatpak-builder --ccache keeps its cache in .flatpak-builder/ccache. Carry it between
    # runs so a push only recompiles what changed. Each run saves under a new key (caches
    # are immutable) and restores the newest one for this flatpak.
    - name: 'Linux-Flatpak: Restore ccache'
      if: matrix.flatpak
      uses: actions/cache@v4
      with:
        path: .flatpak-builder/ccache
        key: flatpak-ccache-${{ matrix.flatpak_id }}-${{ github.sha }}
        restore-keys: flatpak-ccache-${{ matrix.flatpak_id }}-

    - name: 'Linux-Flatpak: Build flatpak'
      if: matrix.flatpak
      run: |
        mkdir -p .flatpak-builder/ccache
        echo "max_size = 2G" > .flatpak-builder/ccache/ccache.conf
        CCACHE_DIR=.flatpak-builder/ccache ccache --zero-stats
        flatpak-builder --ccache --force-clean --repo=flatpak-repo "$RUNNER_TEMP/flatpak-build-dir" flatpak/${{ matrix.flatpak_id }}.yml
        flatpak build-bundle flatpak-repo ${{ matrix.flatpak_bundle }} ${{ matrix.flatpak_id }}
        CCACHE_DIR=.flatpak-builder/ccache ccache --show-stats

    # ======================================
    #      macOS
    # ======================================

    # - name: 'macOS: Install Qt 5.15.2'
    #   if: matrix.name == 'macOS'
    #   uses: jurplel/install-qt-action@v4
    #   with:
    #     version: '5.15.2'
    #     arch: 'clang_64'

    # - name: 'macOS: Install SDL2, moltenvk'
    #   if: matrix.name == 'macOS'
    #   run: |
    #     brew install sdl2 molten-vk

    # TODO: mac artifacts
    # mkdir Frameworks
    # cp /usr/local/lib/libSDL2.dylib ./Frameworks/libSDL2.dylib
    # cp /usr/local/lib/libMoltenVK.dylib ./Frameworks/libMoltenVK.dylib
    # cpack -G DragNDrop

    # - name: 'macOS: Build'
    #   if: matrix.name == 'macOS'
    #   run: |
    #     mkdir build
    #     cd build
    #     cmake .. -G"Unix Makefiles" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=$CONFIGURATION -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5) -DCI_PROVIDER="GitHub" -DBUILD_NUMBER=$GITHUB_RUN_NUMBER
    #     make -j4

    # ======================================
    #      Artifacts
    # ======================================

    - name: 'Windows: Upload relive binaries'
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-${{ env.CONFIGURATION }}-relive-binaries
        path: |
          build\Source\relive\${{ env.CONFIGURATION }}\relive.exe
          build\Source\relive\${{ env.CONFIGURATION }}\SDL3.dll

    - name: 'Windows: Upload relive symbols'
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-${{ env.CONFIGURATION }}-relive-symbols
        path: build\Source\relive\${{ env.CONFIGURATION }}\relive.pdb

    - name: 'Linux-AppImage: Upload relive and relive-editor AppImages'
      if: matrix.name == 'Linux-AppImage'
      uses: actions/upload-artifact@v4
      with:
        name: Linux-${{ env.CONFIGURATION }}-relive-appimages
        path: build/*.AppImage

    # The flatpak manifests always build Release, whatever CONFIGURATION is.
    - name: 'Linux-Flatpak: Upload flatpak'
      if: matrix.flatpak
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.flatpak_artifact }}
        path: ${{ matrix.flatpak_bundle }}

